[workspace]
resolver = "3"
members = [
    "crates/pebble-diagnostic",
    "crates/pebble-parser",
    "crates/pebble-hir",
    "crates/pebble-semantics",
    "crates/pebble-duckdb",
    "crates/pebble-latex",
    "crates/pebble-driver",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }

[profile.release]
debug = false
